name: PR Checks

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

run-name: PR Checks ${{ github.ref_name }}

jobs:
  lint-pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$PR_TITLE" | grep -qP '^[A-Z]'; then
            echo "::error::PR title must start with an uppercase letter. Got: $PR_TITLE"
            exit 1
          fi
          if echo "$PR_TITLE" | grep -qP '^[a-z]+(\(.+\))?:'; then
            echo "::error::PR title must not use conventional commit format (feat:, fix:, etc.). Use a descriptive sentence starting with uppercase instead. Got: $PR_TITLE"
            exit 1
          fi
          echo "✅ PR title looks good: $PR_TITLE"

  pr-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Install Node Dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Astro Check
        run: pnpm astro check

      - name: TypeScript Check (Node)
        run: pnpm tscheck:node

      - name: TypeScript Check (Renderer)
        run: pnpm tscheck:renderer

      - name: Tests
        run: pnpm test run

      - name: Lint
        run: pnpm lint

      - name: Formatting Check
        run: pnpm exec prettier --check .
