name: PR Checks

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

run-name: PR Checks ${{ github.ref_name }}

jobs:
  pr-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.4.0
        with:
          version: 10.28.0

      - name: Install Node Dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Astro Check
        run: pnpm astro check

      - name: TypeScript Check (Node)
        run: pnpm tscheck:node

      - name: TypeScript Check (Renderer)
        run: pnpm tscheck:renderer

      - name: Tests
        run: pnpm test run

      - name: Lint
        run: pnpm lint

      - name: Formatting Check
        run: pnpm exec prettier --check .
