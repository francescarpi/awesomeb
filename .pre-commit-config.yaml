default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: local
    hooks:
      - id: astro
        name: Astro
        entry: pnpm astro check
        language: system
        pass_filenames: false
        files: \.(ts|astro)$
        stages: [pre-commit]

      - id: eslint
        name: Linter
        entry: pnpm lint
        language: system
        pass_filenames: false
        files: \.(ts|astro|js)$
        stages: [pre-commit]

      - id: prettier
        name: Prettier
        entry: pnpm exec prettier --check src
        language: system
        pass_filenames: false
        files: \.(ts|tsx|js|jsx|json|css|md|astro)$
        stages: [pre-commit]

      - id: tscheck
        name: Typescript
        entry: pnpm tscheck
        language: system
        pass_filenames: false
        files: \.(ts|tsx|js|jsx|astro)$
        stages: [pre-commit]

      - id: tests
        name: Tests
        entry: pnpm test run
        language: system
        pass_filenames: false
        files: \.(ts|tsx|js|jsx|json|astro)$
        stages: [pre-commit]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--verbose]

