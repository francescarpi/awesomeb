name: Bug Report
description: Report a bug or unexpected behavior in AwesomeB
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
        Please search existing issues before submitting a new one.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I have searched existing issues and confirmed this is not a duplicate
          required: true
        - label: I am using the latest version of AwesomeB
          required: true

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: A clear and concise description of the bug
      placeholder: When I click X, the browser does Y instead of Z...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open AwesomeB
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: AwesomeB version
      placeholder: "e.g. 0.1.0 (check About menu or package.json)"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: "e.g. macOS 14.5, Windows 11, Ubuntu 24.04"

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / console output
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots (optional)
